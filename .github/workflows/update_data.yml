name: Sync Data to Firebase

on:
  schedule:
    - cron: '0 */3 * * *' # Tu dong chay moi 3 tieng mot lan
  workflow_dispatch:      # Cho phep bam chay thu cong tren giao dien GitHub

permissions:
  contents: read

jobs:
  sync_data:
    name: Sync Trending Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci || npm install

      - name: Fetch fresh data and sync to Firestore
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: npm run fetch
